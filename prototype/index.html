<title>AquaSail Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-cyan:#00adef; --brand-blue:#2c3792; --brand-mid:#1673c0; --brand-blue-hover:#232c76;
    --accent-ink:#036695;
    --surface:#ffffff; --surface-sunken:#f1f7fb; --surface-inset:#e2edf6;
    --ink:#12224a; --ink-muted:#566481; --ink-placeholder:#6b7894;
    --on-brand:#ffffff; --on-accent:#12224a;
    --border:#cfe1ee; --border-strong:#7690a8; --focus-ring:#036695;
    --success:#0b7a56; --success-surface:#e6f4ee;
    --warning:#9a5b00; --warning-surface:#fbf0df;
    --danger:#b4271f; --danger-surface:#fdeceb;
    --info-surface:#e4f4fd;
    --font-display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
    --font-sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
    --radius-sm:4px; --radius-md:8px; --radius-lg:16px; --radius-xl:24px; --radius-pill:999px;
    --shadow-sm:0 1px 2px rgba(18,34,74,.08);
    --shadow-md:0 4px 12px rgba(18,34,74,.10);
    --shadow-lg:0 16px 40px rgba(18,34,74,.14);
  }
  /* This is a single, deliberately light brand system (the brand's own tokens define no dark theme) — redeclared under both guards so the page never inherits an unreadable host ground. */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: light; } }
  :root[data-theme="dark"]{ color-scheme: light; }

  *{box-sizing:border-box;}
  body{background:var(--surface-sunken); color:var(--ink); font-family:var(--font-sans); margin:0;}
  h1,h2,h3,h4{margin:0; font-family:var(--font-display); font-weight:600; text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:var(--accent-ink);}
  ::selection{ background:var(--brand-cyan); color:var(--on-accent); }
  :focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; border-radius:var(--radius-sm); }

  .display-xl{font-family:var(--font-display); font-size:40px; line-height:44px; font-weight:600; letter-spacing:-.005em;}
  .display-lg{font-family:var(--font-display); font-size:32px; line-height:36px; font-weight:600;}
  .display-md{font-family:var(--font-display); font-size:24px; line-height:30px; font-weight:500;}
  .eyebrow{font-family:var(--font-sans); font-size:12px; line-height:16px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:var(--accent-ink);}
  .heading-sm{font-size:20px; line-height:28px; font-weight:600;}
  .body-lg{font-size:18px; line-height:28px;}
  .body{font-size:16px; line-height:24px;}
  .body-sm{font-size:14px; line-height:20px;}
  .caption{font-size:12px; line-height:18px; color:var(--ink-muted);}
  .label{font-size:13px; line-height:16px; font-weight:600; letter-spacing:.04em;}
  .btn-text{font-size:15px; line-height:20px; font-weight:600;}
  .code{font-family:var(--font-mono); font-size:14px; line-height:20px;}
  .muted{color:var(--ink-muted);}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- app shell ---------- */
  #app{display:flex; min-height:100vh;}
  .sidebar{width:232px; flex:none; background:var(--brand-blue); color:var(--on-brand); display:flex; flex-direction:column; padding:var(--space-5) var(--space-3);}
  .sidebar .brandmark{display:flex; align-items:center; gap:var(--space-2); padding:0 var(--space-2) var(--space-6);}
  .sidebar .brandmark img{width:36px; height:auto; display:block;}
  .sidebar .brandmark span{font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:.01em; line-height:1.2;}
  .navlink{display:flex; align-items:center; gap:var(--space-3); padding:11px var(--space-3); border-radius:var(--radius-md); color:rgba(255,255,255,.78); text-decoration:none; font-size:15px; font-weight:500; cursor:pointer; border:none; background:none; width:100%; text-align:left; min-height:44px;}
  .navlink:hover{background:rgba(255,255,255,.08); color:#fff;}
  .navlink.active{background:rgba(255,255,255,.16); color:#fff;}
  .navlink .dot{width:6px; height:6px; border-radius:50%; background:var(--brand-cyan); flex:none; opacity:0;}
  .navlink.active .dot{opacity:1;}
  .nav-section{margin-top:var(--space-6); padding:0 var(--space-3); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:rgba(255,255,255,.5); font-weight:600;}
  .sidebar-foot{margin-top:auto; padding:var(--space-3); font-size:12px; color:rgba(255,255,255,.55); line-height:1.5;}

  .main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); background:var(--surface); border-bottom:1px solid var(--border); padding:var(--space-3) var(--space-6); min-height:64px;}
  .topbar-left{display:flex; flex-direction:column;}
  .topbar-right{display:flex; align-items:center; gap:var(--space-4);}
  .avatar{width:36px; height:36px; border-radius:50%; background:var(--surface-inset); color:var(--brand-blue); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; font-family:var(--font-display);}
  .user-block{text-align:right; line-height:1.25;}
  .signout{background:none; border:1px solid var(--border-strong); border-radius:var(--radius-md); padding:8px 14px; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; min-height:40px;}
  .signout:hover{background:var(--surface-sunken);}

  main{flex:1; padding:var(--space-6); max-width:1360px; width:100%; margin:0 auto;}
  @media (max-width:900px){ main{padding:var(--space-4);} .topbar{padding:var(--space-3) var(--space-4);} }
  @media (max-width:760px){
    #app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; align-items:center; padding:var(--space-3) var(--space-4); overflow-x:auto; gap:var(--space-2);}
    .sidebar .brandmark{padding:0 var(--space-2) 0 0; margin-right:var(--space-2);}
    .sidebar .brandmark span{display:none;}
    .navlink{white-space:nowrap; width:auto;}
    .nav-section, .sidebar-foot{display:none;}
  }

  /* ---------- primitives ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:600; border-radius:var(--radius-md); padding:0 18px; min-height:44px; cursor:pointer; border:1px solid transparent; transition:background .12s ease;}
  .btn-primary{background:var(--brand-blue); color:var(--on-brand); box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--brand-blue-hover);}
  .btn-primary:disabled{background:var(--surface-inset); color:var(--ink-placeholder); cursor:not-allowed;}
  .btn-secondary{background:var(--surface); color:var(--ink); border-color:var(--border-strong);}
  .btn-secondary:hover{background:var(--surface-sunken);}
  .btn-ghost{background:none; color:var(--accent-ink); border-color:transparent; padding:0 8px; min-height:36px;}
  .btn-ghost:hover{background:var(--info-surface);}
  .btn-danger{background:var(--surface); color:var(--danger); border-color:var(--danger);}
  .btn-danger:hover{background:var(--danger-surface);}
  .btn-sm{min-height:36px; padding:0 12px; font-size:14px;}
  .btn-block{width:100%;}

  label.field{display:flex; flex-direction:column; gap:6px;}
  .input, select.input, textarea.input{font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1.5px solid var(--border-strong); border-radius:var(--radius-md); padding:11px var(--space-3); min-height:44px; width:100%;}
  .input::placeholder{color:var(--ink-placeholder);}
  .input:focus{outline:2px solid var(--focus-ring); outline-offset:1px; border-color:var(--focus-ring);}
  .input.invalid{border-color:var(--danger); background:var(--danger-surface);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
  .card-pad{padding:var(--space-5);}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:4px 10px; border-radius:var(--radius-pill); white-space:nowrap;}
  .badge-success{background:var(--success-surface); color:var(--success);}
  .badge-warning{background:var(--warning-surface); color:var(--warning);}
  .badge-danger{background:var(--danger-surface); color:var(--danger);}
  .badge-info{background:var(--info-surface); color:var(--accent-ink);}
  .badge-neutral{background:var(--surface-inset); color:var(--ink-muted);}

  .alert{border-radius:var(--radius-lg); padding:var(--space-4) var(--space-5); display:flex; gap:var(--space-3); align-items:flex-start;}
  .alert-danger{background:var(--danger-surface); color:var(--danger);}
  .alert-warning{background:var(--warning-surface); color:var(--warning);}
  .alert-info{background:var(--info-surface); color:var(--accent-ink);}
  .alert b{color:var(--ink);}

  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted); padding:10px var(--space-3); border-bottom:1px solid var(--border); background:var(--surface-sunken);}
  td{padding:13px var(--space-3); border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle;}
  tr.row-link{cursor:pointer;}
  tr.row-link:hover td{background:var(--surface-sunken);}
  tr.row-cancelled td{color:var(--ink-placeholder); text-decoration:line-through;}
  .table-wrap{overflow-x:auto; border-radius:var(--radius-lg); border:1px solid var(--border);}
  .table-wrap table{border-radius:var(--radius-lg); overflow:hidden;}

  .kpi-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:var(--space-4); margin-bottom:var(--space-6);}
  @media (max-width:1100px){ .kpi-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:600px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-4); box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:4px;}
  .kpi .kpi-label{font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted);}
  .kpi .kpi-value{font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--ink);}
  .kpi.warn .kpi-value{color:var(--warning);}
  .kpi.accent .kpi-value{color:var(--brand-mid);}

  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-4); margin-bottom:var(--space-5); flex-wrap:wrap;}

  .grad-rule{height:3px; border-radius:var(--radius-pill); background:linear-gradient(90deg,var(--brand-cyan),var(--brand-blue)); border:none; margin:0;}

  /* wizard */
  .wizard-grid{display:grid; grid-template-columns:1fr 380px; gap:var(--space-5); align-items:start;}
  @media (max-width:980px){ .wizard-grid{grid-template-columns:1fr;} }
  .wiz-section{margin-bottom:var(--space-5);}
  .wiz-section .num-badge{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:var(--brand-blue); color:var(--on-brand); font-size:12px; font-weight:700; margin-right:8px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3);}
  @media (max-width:520px){ .field-row{grid-template-columns:1fr;} }
  .source-cards{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3);}
  @media (max-width:600px){ .source-cards{grid-template-columns:1fr;} }
  .boat-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-3);}
  @media (max-width:700px){ .boat-cards{grid-template-columns:1fr;} }
  .radio-card{border:1.5px solid var(--border-strong); border-radius:var(--radius-lg); padding:var(--space-4); cursor:pointer; display:flex; flex-direction:column; gap:4px; min-height:44px;}
  .radio-card.selected{border-color:var(--brand-blue); background:var(--info-surface); box-shadow:0 0 0 1px var(--brand-blue) inset;}
  .package-tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--space-3);}
  @media (max-width:640px){ .package-tiles{grid-template-columns:1fr;} }
  .pkg-tile{border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-4); cursor:pointer; text-align:left; background:var(--surface); display:flex; flex-direction:column; gap:6px; min-height:44px; position:relative;}
  .pkg-tile:hover{border-color:var(--border-strong);}
  .pkg-tile.selected{border-color:var(--brand-blue); box-shadow:0 0 0 1.5px var(--brand-blue) inset; background:var(--info-surface);}
  .pkg-tile .key{position:absolute; top:10px; right:12px; font-size:11px; color:var(--ink-placeholder); font-family:var(--font-mono);}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:36px; height:36px; border-radius:var(--radius-md); border:1.5px solid var(--border-strong); background:var(--surface); font-size:18px; font-weight:600; cursor:pointer; color:var(--ink);}
  .stepper button:hover{background:var(--surface-sunken);}
  .stepper .count{width:28px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums;}
  .part-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);}
  .part-row:last-child{border-bottom:none;}

  .banner-nocollect{background:var(--danger-surface); border:1.5px solid var(--danger); border-radius:var(--radius-lg); padding:var(--space-4); display:flex; gap:var(--space-3); align-items:center; margin-top:var(--space-3);}
  .banner-nocollect b{color:var(--danger); font-size:16px;}

  .match-banner{background:var(--info-surface); border:1px solid var(--brand-mid); border-radius:var(--radius-lg); padding:var(--space-3) var(--space-4); display:flex; justify-content:space-between; align-items:center; gap:var(--space-3); margin-top:var(--space-2);}

  .quote-panel{position:sticky; top:var(--space-4);}
  .quote-line{display:flex; justify-content:space-between; gap:var(--space-2); padding:9px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .quote-line .ln-name{color:var(--ink);}
  .quote-line .ln-sub{color:var(--ink-muted); font-size:12px;}
  .quote-total-row{display:flex; justify-content:space-between; padding-top:var(--space-3); font-size:14px;}
  .quote-total-row.grand{font-size:20px; font-weight:700; font-family:var(--font-display); padding-top:var(--space-3); border-top:1.5px solid var(--ink); margin-top:var(--space-2);}

  .divider{height:1px; background:var(--border); border:none; margin:var(--space-5) 0;}

  /* ticket */
  .ticket-wrap{max-width:460px; margin:0 auto;}
  .ticket{border:1.5px dashed var(--border-strong); border-radius:var(--radius-lg); padding:var(--space-6); background:var(--surface); position:relative;}
  .ticket .tk-logo{display:flex; align-items:center; gap:10px; margin-bottom:var(--space-5);}
  .ticket .tk-logo img{height:26px; width:auto;}
  .ticket .qr-box{width:96px; height:96px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; float:right; margin-left:var(--space-3);}
  .tk-ref{font-family:var(--font-mono); font-size:22px; font-weight:700; letter-spacing:.03em; color:var(--brand-blue);}
  .tk-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dotted var(--border); font-size:14px;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; left:0; top:0; width:100%;}
    .no-print{display:none !important;}
    .ticket{border:none;}
  }

  /* pricing matrix */
  .pmatrix{width:100%; border-collapse:collapse;}
  .pmatrix th, .pmatrix td{border:1px solid var(--border); padding:10px; text-align:center; font-size:14px;}
  .pmatrix th{background:var(--surface-sunken); font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-muted);}
  .pmatrix td.rowhead{text-align:left; font-weight:600; color:var(--ink); background:var(--surface-sunken);}
  .pcell{cursor:pointer; border-radius:var(--radius-sm); padding:6px; font-variant-numeric:tabular-nums; font-weight:600;}
  .pcell:hover{background:var(--info-surface);}
  .pcell.missing{color:var(--danger); font-weight:600; font-size:12px; background:var(--danger-surface); text-transform:uppercase; letter-spacing:.02em;}
  .pcell.future::after{content:"→"; color:var(--brand-mid); margin-left:4px; font-size:11px;}
  .tabs{display:inline-flex; background:var(--surface-inset); border-radius:var(--radius-md); padding:3px; gap:2px;}
  .tab{border:none; background:none; padding:8px 16px; border-radius:6px; font-size:14px; font-weight:600; color:var(--ink-muted); cursor:pointer; min-height:36px;}
  .tab.active{background:var(--surface); color:var(--brand-blue); box-shadow:var(--shadow-sm);}

  /* modal */
  .modal-backdrop{position:fixed; inset:0; background:rgba(18,34,74,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:var(--space-4);}
  .modal{background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); max-width:460px; width:100%; padding:var(--space-5); max-height:90vh; overflow-y:auto;}
  .modal h3{margin-bottom:var(--space-4);}

  .empty-state{text-align:center; padding:var(--space-8) var(--space-4); color:var(--ink-muted);}
  .toast-host{position:fixed; bottom:var(--space-5); right:var(--space-5); display:flex; flex-direction:column; gap:8px; z-index:80;}
  .toast{background:var(--ink); color:#fff; padding:12px 18px; border-radius:var(--radius-md); font-size:14px; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:8px;}
  .toast.success{background:var(--success);}
  .toast.danger{background:var(--danger);}

  .kbd{font-family:var(--font-mono); font-size:11px; background:var(--surface-inset); border:1px solid var(--border-strong); border-radius:4px; padding:1px 6px;}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div class="toast-host" id="toast-host"></div>

<script>
/* =========================================================================
   AquaSail Ops — interactive prototype
   Vanilla JS SPA. Mock data + a real effective-dated pricing engine, so the
   numbers on screen are computed the same way the build plan specifies,

/* ---------------- price rules ----------------
   { targetType:'activity'|'package', targetId, participant:'adult'|'child'|'infant',
     audience:'walk_in'|'operator', operatorId, retail, net, from, to }
   `to` is exclusive; null = still current. Never mutated — only closed + appended. */
function buildBasePriceRules(){
  const rules = [];
  let rid = 1;
  const add = (targetType, targetId, participant, audience, operatorId, retail, net, from, to) => {
    rules.push({ id:'PR'+(rid++), targetType, targetId, participant, audience, operatorId, retail, net, from, to });
  };
  const walkinBase = { // [adult, child] — CATAMARAN excluded here, it gets a real history below
    PARASAIL:[2200,1600], UNDERSEA:[3200,2400], UNDERSEAPHOTO:[600,400], TUBE:[1200,900], SPEEDBOAT:[1500,1000],
    PRIVATEBOAT:[5000,2500], ISLANDVISIT:[2500,1500], LUNCH:[850,500], SNORKEL:[1100,800],
  };
  for(const code in walkinBase){
    const [adult,child] = walkinBase[code];
    add('activity',code,'adult','walk_in',null,adult,null,'2026-01-01',null);
    add('activity',code,'child','walk_in',null,child,null,'2026-01-01',null);
    add('activity',code,'infant','walk_in',null,0,null,'2026-01-01',null);
  }
  // Catamaran has a real price history, on purpose: proves out effective-dated pricing.
  add('activity','CATAMARAN','adult','walk_in',null,1700,null,'2026-01-01','2026-09-01');
  add('activity','CATAMARAN','adult','walk_in',null,1800,null,'2026-09-01','2026-10-01');
  add('activity','CATAMARAN','adult','walk_in',null,1950,null,'2026-10-01',null);
  add('activity','CATAMARAN','child','walk_in',null,850,null,'2026-01-01','2026-09-01');
  add('activity','CATAMARAN','child','walk_in',null,900,null,'2026-09-01',null);
  add('activity','CATAMARAN','infant','walk_in',null,0,null,'2026-01-01',null);

  // bundle package prices (walk-in)
  const bundleBase = { ISLANDEXP:[3200,1900], SUNSET:[2100,1100] };
  for(const code in bundleBase){
    const [adult,child] = bundleBase[code];
    add('package',code,'adult','walk_in',null,adult,null,'2026-01-01',null);
    add('package',code,'child','walk_in',null,child,null,'2026-01-01',null);
    add('package',code,'infant','walk_in',null,0,null,'2026-01-01',null);
  }

  // operator net-rate rows — only net_rate operators need these; commission and none fall back to walk-in
  const netRows = [
    ['BEACHCOMB','SUNSET',1500,800], ['BEACHCOMB','CATAMARAN',1300,650],
    ['HERITAGE','PRIVATEBOAT',4200,2100],
  ];
  for(const [opCode,targetCode,adultNet,childNet] of netRows){
    const targetType = pkgByCode(targetCode) ? 'package' : 'activity';
    add(targetType,targetCode,'adult','operator',opCode,null,adultNet,'2026-01-01',null);
    add(targetType,targetCode,'child','operator',opCode,null,childNet,'2026-01-01',null);
    add(targetType,targetCode,'infant','operator',opCode,null,0,'2026-01-01',null);
  }
  return rules;
}

function resolveRule(rules, targetType, targetId, participant, audience, operatorId, serviceDate){
  const inWindow = r => r.from <= serviceDate && (!r.to || serviceDate < r.to);
  if(audience==='operator'){
    const opRule = rules.find(r => r.targetType===targetType && r.targetId===targetId && r.participant===participant && r.audience==='operator' && r.operatorId===operatorId && inWindow(r));
    if(opRule) return opRule;
  }
  return rules.find(r => r.targetType===targetType && r.targetId===targetId && r.participant===participant && r.audience==='walk_in' && inWindow(r)) || null;
}

// Resolves ONE line (an activity, or a package expanded per its pricing_mode) for ONE participant type.
function resolveLine(rules, kind, code, participant, operatorCode, serviceDate){
  const audience = operatorCode ? 'operator' : 'walk_in';
  if(kind==='activity'){
    const rule = resolveRule(rules,'activity',code,participant,audience,operatorCode,serviceDate);
    if(!rule) return { ok:false, error:`No price configured for ${actByCode(code).name} / ${participant} on ${serviceDate}.` };
    const retail = rule.retail ?? rule.net; // an operator-only net row has no retail; use net as the reference figure
    return { ok:true, retail, net: rule.net, ruleId: rule.id, warning:null };
  }
  const pkg = pkgByCode(code);
  if(pkg.mode==='bundle'){
    const rule = resolveRule(rules,'package',code,participant,audience,operatorCode,serviceDate);
    if(!rule) return { ok:false, error:`No price configured for ${pkg.name} / ${participant} on ${serviceDate}.` };
    const retail = rule.retail ?? rule.net;
    return { ok:true, retail, net: rule.net, ruleId: rule.id, warning:null };
  }
  // components: sum each included activity
  let retail=0, net=0, hasNet=true, ruleIds=[];
  for(const actCode of pkg.includes){
    const r = resolveLine(rules,'activity',actCode,participant,operatorCode,serviceDate);
    if(!r.ok) return r;
    retail += r.retail; ruleIds.push(r.ruleId);
    if(r.net==null) hasNet=false; else net += r.net;
  }
  return { ok:true, retail, net: hasNet?net:null, ruleId: ruleIds.join('+'), warning:null };
}

// Full quote for a set of lines. Each line: {kind:'activity'|'package', code, qty:{adult,child,infant}}
function buildQuote(rules, lines, operatorCode, serviceDate, discount){
  const operator = operatorCode ? opByCode(operatorCode) : null;
  const out = { ok:true, lines:[], retailTotal:0, chargedTotal:0, discountTotal:0, operatorNetTotal:0, commissionTotal:0, warnings:[] };
  for(const line of lines){
    for(const participant of ['adult','child','infant']){
      const qty = line.qty[participant] || 0;
      if(qty<=0) continue;
      const r = resolveLine(rules, line.kind, line.code, participant, operatorCode, serviceDate);
      if(!r.ok) return { ok:false, error:r.error };
      const label = line.kind==='activity' ? actByCode(line.code).name : pkgByCode(line.code).name;
      let unitCharged, unitOperatorNet=0, unitCommission=0;
      if(!operator || operator.model==='none'){ unitCharged = r.retail; }
      else if(operator.model==='net_rate'){
        if(r.net==null){ unitCharged = r.retail; out.warnings.push(`No net price set for ${label} / ${participant} — using retail.`); }
        else { unitCharged = r.net; unitOperatorNet = r.net; }
      } else if(operator.model==='commission'){
        unitCharged = r.retail; unitCommission = Math.round(r.retail * operator.rate);
      }
      out.lines.push({ label, participant, qty, unitRetail:r.retail, unitCharged, lineRetail:r.retail*qty, lineCharged:unitCharged*qty, lineOperatorNet:unitOperatorNet*qty, lineCommission:unitCommission*qty });
      out.retailTotal += r.retail*qty; out.chargedTotal += unitCharged*qty;
      out.operatorNetTotal += unitOperatorNet*qty; out.commissionTotal += unitCommission*qty;
    }
  }
  let discountAmt = 0;
  if(discount && discount.value>0){
    discountAmt = discount.type==='percent' ? Math.round(out.chargedTotal * discount.value/100) : Math.round(discount.value*100);
    discountAmt = Math.min(discountAmt, out.chargedTotal);
  }
  out.discountTotal = discountAmt;
  out.chargedTotal -= discountAmt;
  out.payer = operator ? operator.payer : 'client';
  return out;
}

/* expand a booking's lines into entitlements (booking_activities) */
function expandEntitlements(lines){
  const totals = {}; // activityCode -> count of people entitled
  for(const line of lines){
    const totalPeople = (line.qty.adult||0)+(line.qty.child||0)+(line.qty.infant||0);
    if(totalPeople<=0) continue;
    const codes = line.kind==='activity' ? [line.code] : pkgByCode(line.code).includes;
    for(const c of codes) totals[c] = (totals[c]||0) + totalPeople;
  }
  return totals;
}

      status: sc.cancel ? 'cancelled' : 'confirmed', payer, resourceCode: sc.boat || null,
      lines: sc.lines, quote, discount: sc.discount || null,
      payments, createdAt, createdBy: USER.name, notes:'',
      cancelledAt: null, cancelledBy:null, cancelReason:null,
      printedCount: 0, ticketToken: 'tkn_' + ref.toLowerCase().replace(/-/g,''),
      audit: [ { at: createdAt, who: USER.name, action: 'Booking created', detail: `${quote.lines.length} line item(s), charged ${quote.chargedTotal}` } ],
    };
    if(sc.payment) booking.audit.push({ at:createdAt, who:USER.name, action:'Payment recorded', detail: `${sc.payment.method} · Rs ${(quote.chargedTotal/100).toLocaleString()}` });
    if(sc.cancel){
      const cancelAt = `${serviceDate}T07:50:00+04:00`;
      booking.cancelledAt = cancelAt; booking.cancelledBy = USER.name; booking.cancelReason = sc.cancel.reason;
      booking.audit.push({ at:cancelAt, who:USER.name, action:'Booking cancelled', detail: sc.cancel.reason });
      if(sc.cancel.refund && payments.length){
        const corr = { id:ref+'-P2', amount:-quote.chargedTotal, method:payments[0].method, receivedFrom:'client', receivedAt:cancelAt, correction:true, note:'Refunded in cash after cancellation.' };
        payments.push(corr);
        booking.audit.push({ at:cancelAt, who:USER.name, action:'Payment correction', detail:`Refund of Rs ${(quote.chargedTotal/100).toLocaleString()} recorded against ${payments[0].id}` });
      }
    }
    bookings.push(booking);
  }
  return bookings;
}

function freshState(){
  const rules = buildBasePriceRules();
  const clients = seedClients();
  const bookings = seedBookingsAndTickets(rules, clients);
  return { rules, clients, bookings, nextSeq: bookings.length+1 };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return freshState();
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }catch(e){} }
function resetDemo(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} STATE = freshState(); saveState(); navigate('today'); toast('Demo data reset.', 'success'); }

/* ---------------- formatting helpers ---------------- */
function formatRs(cents){
  const v = Math.round(cents)/100;
  const sign = v<0 ? '-' : '';
  return sign + 'Rs ' + Math.abs(v).toLocaleString('en-MU', { minimumFractionDigits: v%1!==0 ? 2:0, maximumFractionDigits:2 });
}
function formatDateLong(iso){
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function formatDateShort(iso){
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function clientName(c){ return c ? `${c.firstName} ${c.lastName}` : '—'; }
function totalPeople(qty){ return (qty.adult||0)+(qty.child||0)+(qty.infant||0); }
function bookingPeople(b){ return b.lines.length ? totalPeople(b.lines[0].qty) : 0; } // every line in a booking covers the same party
function bookingPaid(b){ return b.payments.reduce((s,p)=>s+p.amount,0); }
function lineSummary(b){
  return b.lines.map(l=>{
    const name = l.kind==='activity' ? actByCode(l.code).name : pkgByCode(l.code).name;
    return `${name} ×${totalPeople(l.qty)}`;
  }).join(', ');
}

/* ---------------- toast ---------------- */
function toast(msg, kind){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind?(' '+kind):'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>el.remove(), 3400);
}

/* ================= TODAY ================= */
function viewToday(){
  const todaysBookings = STATE.bookings.filter(b=>b.serviceDate===TODAY);
  const active = todaysBookings.filter(b=>b.status!=='cancelled');
  const count = active.length;
  const people = active.reduce((s,b)=>s+bookingPeople(b),0);
  const chargedTotal = active.reduce((s,b)=>s+b.quote.chargedTotal,0);
  const cashCollected = todaysBookings.reduce((s,b)=>s+b.payments.filter(p=>p.method==='cash').reduce((a,p)=>a+p.amount,0),0);
  const outstanding = active.reduce((s,b)=>s + Math.max(0, b.quote.chargedTotal - bookingPaid(b)), 0);
  const operatorAccountCount = active.filter(b=>b.payer==='operator').length;

  const sorted = [...todaysBookings].sort((a,b)=> a.departureTime.localeCompare(b.departureTime));
  const rows = sorted.map(b=>{
    const c = STATE.clients.find(cl=>cl.id===b.clientId);
    const paid = bookingPaid(b);
    const balance = b.quote.chargedTotal - paid;
    let payBadge;
    if(b.status==='cancelled') payBadge = `<span class="badge badge-neutral">Cancelled</span>`;
    else if(b.payer==='operator') payBadge = `<span class="badge badge-warning">Operator account</span>`;
    else if(balance<=0) payBadge = `<span class="badge badge-success">Paid</span>`;
    else payBadge = `<span class="badge badge-danger">Rs ${(balance/100).toLocaleString()} due</span>`;
    const sourceLabel = b.source==='walk_in' ? 'Walk-in' : opByCode(b.operatorCode).name;
    return `<tr class="row-link ${b.status==='cancelled'?'row-cancelled':''}" onclick="navigate('#/booking/${b.id}')">
      <td class="code num">${b.departureTime}</td>
      <td>${clientName(c)}</td>
      <td class="body-sm">${lineSummary(b)}</td>
      <td class="num" style="text-align:center;">${bookingPeople(b)}</td>
      <td class="num">${formatRs(b.quote.chargedTotal)}</td>
      <td>${payBadge}</td>
      <td class="body-sm">${sourceLabel}</td>
    </tr>`;
  }).join('');

  // activity summary panel
  const entTotals = {};
  active.forEach(b=>{ const e = expandEntitlements(b.lines); for(const k in e) entTotals[k]=(entTotals[k]||0)+e[k]; });
  const entRows = Object.entries(entTotals).sort((a,b)=>b[1]-a[1]).map(([code,n])=>`
    <div class="part-row"><span class="body-sm">${actByCode(code).name}</span><span class="num body-sm" style="font-weight:700;">${n}</span></div>`).join('') || `<div class="empty-state">No entitlements yet today.</div>`;

  const fleet = fleetTotals();
  const fleetRows = RESOURCES.map(r=>{
    const n = fleet[r.code]||0;
    const pct = Math.min(100, Math.round((n/r.capacity)*100));
    const barColor = pct>=90 ? 'var(--danger)' : pct>=70 ? 'var(--warning)' : 'var(--brand-mid)';
    return `<div style="margin-bottom:12px;">
      <div class="part-row" style="border-bottom:none; padding-bottom:4px;">
        <span class="body-sm">${r.name} <span class="caption">· ${r.type}</span></span>
        <span class="num body-sm" style="font-weight:700;">${n} / ${r.capacity}</span>
      </div>
      <div style="height:6px; background:var(--surface-inset); border-radius:var(--radius-pill); overflow:hidden;">
        <div style="height:100%; width:${pct}%; background:${barColor};"></div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="page-head">
    <div>
      <div class="eyebrow">Reception · Today</div>
      <h1 class="display-lg">Today's bookings</h1>
    </div>
    <div style="display:flex; gap:var(--space-3); align-items:center;">
      <input class="input" style="width:240px;" placeholder="Search reference, name or phone…" oninput="onTodaySearch(this.value)"/>
      <button class="btn btn-secondary" onclick="navigate('#/register')">Daily register</button>
      <button class="btn btn-primary" onclick="navigate('#/new-booking')">+ New booking</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Bookings</div><div class="kpi-value num">${count}</div></div>
    <div class="kpi"><div class="kpi-label">People</div><div class="kpi-value num">${people}</div></div>
    <div class="kpi accent"><div class="kpi-label">Charged total</div><div class="kpi-value num">${formatRs(chargedTotal)}</div></div>
    <div class="kpi"><div class="kpi-label">Cash collected</div><div class="kpi-value num">${formatRs(cashCollected)}</div></div>
    <div class="kpi ${outstanding>0?'warn':''}"><div class="kpi-label">Outstanding</div><div class="kpi-value num">${formatRs(outstanding)}</div></div>
    <div class="kpi ${operatorAccountCount>0?'warn':''}"><div class="kpi-label">Operator account</div><div class="kpi-value num">${operatorAccountCount}</div></div>
  </div>

  <div style="display:grid; grid-template-columns:1fr 300px; gap:var(--space-5); align-items:start;">
    <div class="table-wrap">
      <table id="today-table">
        <thead><tr><th>Time</th><th>Client</th><th>Package / activity</th><th style="text-align:center;">People</th><th>Total</th><th>Payment</th><th>Source</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="display:flex; flex-direction:column; gap:var(--space-5);">
      <div class="card card-pad">
        <div class="label" style="margin-bottom:var(--space-3); color:var(--ink-muted);">Fleet today</div>
        ${fleetRows}
        <div class="caption" style="margin-top:4px;">Headcount per vessel, computed automatically from each booking's boat assignment. Excludes cancelled bookings.</div>
      </div>
      <div class="card card-pad">

        ${entRows}

      </div>
    </div>
  </div>`;
}

function renderQuotePanel(quote, w, operator){
  if(!quote || !w.lines.length){
    return `<div class="card card-pad"><div class="empty-state" style="padding:var(--space-6) 0;">Pick a package or activity to see the quote.</div></div>`;
  }
  if(!quote.ok){
    return `<div class="card card-pad"><div class="alert alert-danger"><b>${quote.error}</b><div class="body-sm">Ask an admin to set this price before continuing.</div></div></div>`;
  }
  const lines = quote.lines.map(l=>`<div class="quote-line"><div><div class="ln-name">${l.label} <span class="ln-sub">×${l.qty} ${l.participant}</span></div></div><div class="num">${formatRs(l.lineCharged)}</div></div>`).join('');
  const changeDue = w.amountReceived ? Math.max(0, w.amountReceived*100 - quote.chargedTotal) : 0;
  const canSubmit = w.firstName && w.source && (!(w.discountValue>0) || w.discountReason) && (!needsBoat(w.lines) || w.resourceCode) && (operator&&operator.payer==='operator' ? true : w.amountReceived>0);
  return `<div class="card card-pad">
    <div class="label" style="color:var(--ink-muted); margin-bottom:var(--space-2);">Quote</div>
    ${lines}
    ${quote.discountTotal>0 ? `<div class="quote-line"><span class="ln-name">Discount</span><span class="num" style="color:var(--danger);">−${formatRs(quote.discountTotal)}</span></div>`:''}
    <div class="quote-total-row grand"><span>Total</span><span class="num">${formatRs(quote.chargedTotal)}</span></div>
    ${operator && operator.model==='commission' ? `<div class="caption" style="margin-top:8px;">Commission owed to ${operator.name}: ${formatRs(quote.commissionTotal)}</div>`:''}
    ${quote.warnings.map(w=>`<div class="alert alert-warning" style="margin-top:8px;">${w}</div>`).join('')}
    ${needsBoat(w.lines) && !w.resourceCode ? `<div class="alert alert-warning" style="margin-top:8px;">Pick a boat below before this can be submitted.</div>`:''}
    ${w.amountReceived>0 && w.paymentMethod==='cash' ? `<div class="quote-total-row"><span>Change due</span><span class="num">${formatRs(changeDue)}</span></div>`:''}
    <button class="btn btn-primary btn-block" style="margin-top:var(--space-4);" ${canSubmit?'':'disabled'} onclick="submitBooking()">Create booking</button>
    <div class="caption" style="margin-top:8px; text-align:center;">Double submissions are prevented automatically.</div>
  </div>`;
}

function renderBoatPicker(w){
  const totals = fleetTotals(w.serviceDate);
  const partySize = w.lines.length ? totalPeople(w.lines[0].qty) : 0;
  const cards = RESOURCES.map(r=>{
    const current = totals[r.code]||0;
    const pct = Math.min(100, Math.round((current/r.capacity)*100));
    const wouldExceed = (current + partySize) > r.capacity;
    const barColor = pct>=90 ? 'var(--danger)' : pct>=70 ? 'var(--warning)' : 'var(--brand-mid)';
    return `<div class="radio-card ${w.resourceCode===r.code?'selected':''}" onclick="wizSetResource('${r.code}')">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:700;">${r.name}</div><span class="caption">${r.type}</span>
      </div>
      <div class="caption num">${current} / ${r.capacity} booked today</div>
      <div style="height:6px; background:var(--surface-inset); border-radius:var(--radius-pill); margin-top:6px; overflow:hidden;">
        <div style="height:100%; width:${pct}%; background:${barColor};"></div>
      </div>
      ${wouldExceed ? `<div class="caption" style="color:var(--danger); margin-top:4px;">Adding ${partySize} more would exceed capacity.</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="boat-cards">${cards}</div>`;
}
function wizSetResource(code){ WIZ.resourceCode = code; renderApp(); }

function findSimilarClients(first, last, phone){
  if(!first && !last && !phone) return [];
  const nf = (first+' '+last).trim().toLowerCase();
  const pf = phone.replace(/\D/g,'');
  return STATE.clients.filter(c=>{
    if(pf.length>=6 && c.phone.replace(/\D/g,'').endsWith(pf)) return true;
    const cf = (c.firstName+' '+c.lastName).toLowerCase();
    return nf.length>=3 && (cf.includes(nf) || nf.includes(c.lastName.toLowerCase()));
  }).slice(0,1);
}

let SUBMITTING = false;
function submitBooking(){
  if(SUBMITTING) return; SUBMITTING = true;
  const w = WIZ;
  const quote = buildQuote(STATE.rules, w.lines, w.operatorCode, w.serviceDate, w.discountValue>0?{type:w.discountType,value:w.discountValue,reason:w.discountReason}:null);
  if(!quote.ok){ toast(quote.error,'danger'); SUBMITTING=false; return; }
  if(w.discountType==='percent' && w.discountValue>MAX_DISCOUNT_RECEPTIONIST){ toast(`Discount above ${MAX_DISCOUNT_RECEPTIONIST}% needs an admin.`,'danger'); SUBMITTING=false; return; }

  let client = w.matchedClientId ? STATE.clients.find(c=>c.id===w.matchedClientId) : null;
  if(!client){
    client = { id:'c'+(STATE.clients.length+1), firstName:w.firstName, lastName:w.lastName||'', phone:w.phone, email:w.email, country:w.country, bookings:0, lastVisit:null };
    STATE.clients.push(client);
  }
  client.bookings += 1; client.lastVisit = w.serviceDate;

  const operator = w.operatorCode ? opByCode(w.operatorCode) : null;
  const payer = operator ? operator.payer : 'client';
  const ref = 'WS-' + w.serviceDate.replace(/-/g,'') + '-' + String(STATE.nextSeq++).padStart(4,'0');
  const now = new Date().toISOString();
  const payments = [];
  if(payer!=='operator' && w.amountReceived>0){
    payments.push({ id:ref+'-P1', amount:Math.round(w.amountReceived*100), method:w.paymentMethod, receivedFrom:'client', receivedAt:now, correction:false, note:null });
  }
  const booking = {
    id:ref, reference:ref, clientId:client.id, source:w.source, operatorCode:w.operatorCode,
    serviceDate:w.serviceDate, departureTime:w.departureTime||'—', meetingPoint:w.meetingPoint,
    status:'confirmed', payer, resourceCode: needsBoat(w.lines) ? w.resourceCode : null,
    lines:JSON.parse(JSON.stringify(w.lines)),
    quote, discount: w.discountValue>0?{type:w.discountType,value:w.discountValue,reason:w.discountReason}:null,
    payments, createdAt:now, createdBy:USER.name, notes:'', cancelledAt:null, cancelledBy:null, cancelReason:null,
    printedCount:0, ticketToken:'tkn_'+ref.toLowerCase().replace(/-/g,''),
    audit:[ { at:now, who:USER.name, action:'Booking created', detail:`${quote.lines.length} line item(s), charged ${quote.chargedTotal}` } ],
  };
  if(payments.length) booking.audit.push({ at:now, who:USER.name, action:'Payment recorded', detail:`${w.paymentMethod} · Rs ${(quote.chargedTotal/100).toLocaleString()}` });
  STATE.bookings.push(booking);
  saveState();
  WIZ = null; SUBMITTING = false;
  toast(`Booking ${ref} created.`, 'success');
  navigate('#/booking/'+ref);
}

document.addEventListener('keydown', (e)=>{
  if(ROUTE.view==='new-booking'){
    if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); submitBooking(); }

});

/* ================= DAILY REGISTER =================
   One printable sheet per operating day: PAX and amount received, broken down
   by vessel and by individual activity, plus a second breakdown by tour operator.
   Every figure is computed from real bookings — nothing here is hand-typed. */
let REGISTER_DATE = TODAY;
const REGISTER_ROWS = [
  { label:'Catamaran A', kind:'boat', code:'CAT_A' },
  { label:'Catamaran B', kind:'boat', code:'CAT_B' },
  { label:'Cataspeed', kind:'boat', code:'CATASPEED' },
  { label:'Undersea Walk', kind:'activity', code:'UNDERSEA' },
  { label:'Parasailing', kind:'activity', code:'PARASAIL' },
  { label:'Undersea Photo', kind:'activity', code:'UNDERSEAPHOTO' },
  { label:'Tube Riding', kind:'activity', code:'TUBE' },
  { label:'Speed Boat', kind:'activity', code:'SPEEDBOAT' },
];

// A boat-bearing booking's full value is attributed to its assigned vessel (never split further —
// snorkelling/lunch riding along on a catamaran trip aren't tracked on this particular sheet).
function boatRowStats(resourceCode, date){
  let pax=0, amount=0;
  STATE.bookings.filter(b=>b.serviceDate===date && b.status!=='cancelled' && b.resourceCode===resourceCode).forEach(b=>{
    pax += bookingPeople(b);
    const paidRatio = b.quote.chargedTotal>0 ? Math.min(1, bookingPaid(b)/b.quote.chargedTotal) : 0;
    amount += b.quote.chargedTotal * paidRatio;
  });
  return { pax, amount: Math.round(amount) };
}

// Standalone activities, and activities inside a "components" package (never a boat booking —
// those are fully counted above). Each activity's own retail/net price is re-resolved on its own,
// then the booking's discount and payment-received ratios are applied proportionally, so nothing
// is invented and a partly-paid booking doesn't overstate today's cash.
function activityRowStats(code, date){
  let pax=0, amount=0;
  STATE.bookings.filter(b=>b.serviceDate===date && b.status!=='cancelled' && !needsBoat(b.lines)).forEach(b=>{
    const matchingLines = b.lines.filter(l => l.kind==='activity' ? l.code===code : pkgByCode(l.code).includes.includes(code));
    if(!matchingLines.length) return;
    const preDiscount = b.quote.lines.reduce((s,l)=>s+l.lineCharged,0);
    const discountRatio = preDiscount>0 ? b.quote.chargedTotal/preDiscount : 1;
    const paidRatio = b.quote.chargedTotal>0 ? Math.min(1, bookingPaid(b)/b.quote.chargedTotal) : 0;
    matchingLines.forEach(l=>{
      ['adult','child','infant'].forEach(pt=>{
        const qty = l.qty[pt]||0; if(qty<=0) return;
        pax += qty;
        const r = resolveLine(STATE.rules, 'activity', code, pt, b.operatorCode, b.serviceDate);
        if(!r.ok) return;
        const operator = b.operatorCode ? opByCode(b.operatorCode) : null;
        const unit = (operator && operator.model==='net_rate') ? (r.net ?? r.retail) : r.retail;
        amount += unit * qty * discountRatio * paidRatio;
      });
    });
  });
  return { pax, amount: Math.round(amount) };
}
function operatorRowStats(opCode, date){
  let pax=0, amount=0;
  STATE.bookings.filter(b=>b.serviceDate===date && b.status!=='cancelled' && b.operatorCode===opCode).forEach(b=>{
    pax += bookingPeople(b); amount += bookingPaid(b);
  });
  return { pax, amount };
}
function registerGrandTotal(date){
  return STATE.bookings.filter(b=>b.serviceDate===date).reduce((s,b)=>s+bookingPaid(b),0);
}
function viewRegister(){
  const rows = REGISTER_ROWS.map(r => ({ label:r.label, ...(r.kind==='boat' ? boatRowStats(r.code, REGISTER_DATE) : activityRowStats(r.code, REGISTER_DATE)) }));
  const opRows = OPERATORS.map(o => ({ label:o.name, sub: o.model==='commission' ? `${(o.rate*100).toFixed(0)}% commission` : 'net rate', ...operatorRowStats(o.code, REGISTER_DATE) }));
  const subtotalPax = rows.reduce((s,r)=>s+r.pax,0);
  const subtotalAmt = rows.reduce((s,r)=>s+r.amount,0);
  const grand = registerGrandTotal(REGISTER_DATE);
  const rowHtml = r => `<tr><td>${r.label}</td><td class="num" style="text-align:center;">${r.pax}</td><td class="num">${formatRs(r.amount)}</td></tr>`;
  return `
  <div class="page-head no-print">
    <div><div class="eyebrow">End of day</div><h1 class="display-lg">Daily register</h1></div>
    <div style="display:flex; gap:12px; align-items:center;">
      <label class="body-sm">Date <input type="date" class="input" style="width:170px; display:inline-block;" value="${REGISTER_DATE}" onchange="REGISTER_DATE=this.value; renderApp();"/></label>
      <button class="btn btn-primary" onclick="window.print()">Print</button>
    </div>
  </div>
  <div id="print-area" class="ticket-wrap" style="max-width:640px;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:var(--space-5);">
      <img src="${LOGO_SVG_DATA_URI}" alt="AquaSail" style="height:20px;"/>
      <div><div style="font-weight:700;">Daily activity &amp; operator register</div><div class="caption">${formatDateLong(REGISTER_DATE)}</div></div>
    </div>
    <div class="table-wrap" style="margin-bottom:var(--space-4);">
      <table>
        <thead><tr><th>Activity</th><th style="text-align:center;">PAX</th><th>Amount received</th></tr></thead>
        <tbody>
          ${rows.map(rowHtml).join('')}
          <tr><td style="font-weight:700;">Subtotal</td><td class="num" style="text-align:center; font-weight:700;">${subtotalPax}</td><td class="num" style="font-weight:700;">${formatRs(subtotalAmt)}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="table-wrap" style="margin-bottom:var(--space-4);">
      <table>
        <thead><tr><th>Tour operator</th><th style="text-align:center;">PAX</th><th>Amount received</th></tr></thead>
        <tbody>${opRows.map(r=>`<tr><td>${r.label} <span class="caption">(${r.sub})</span></td><td class="num" style="text-align:center;">${r.pax}</td><td class="num">${formatRs(r.amount)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="card card-pad">
      <div class="quote-total-row grand"><span>Total received</span><span class="num">${formatRs(grand)}</span></div>
      <div class="caption" style="margin-top:6px;">All bookings, all payment methods, ${formatDateShort(REGISTER_DATE)}. This is the day's reconciliation figure. The tour-operator table is a second view of the same bookings by source, not an additional total — an operator-account booking (e.g. Beachcomber) shows its guests here with Rs 0 received, since that's a receivable, not cash in hand. The activity subtotal only covers what's tracked on this sheet — lunch and snorkelling add-ons aren't itemised here.</div>
    </div>
  </div>`;
}

/* ================= PRICING ================= */
let PRICING_TAB = 'adult';
let PRICING_ASAT = TODAY;
function viewPricing(){
  const targets = [
    ...ACTIVITIES.map(a=>({kind:'activity', code:a.code, name:a.name})),
    ...PACKAGES.filter(p=>p.mode==='bundle').map(p=>({kind:'package', code:p.code, name:p.name+' (bundle)'})),
  ];
  const cols = [{code:null,name:'Walk-in'}, ...OPERATORS.map(o=>({code:o.code,name:o.name}))];

  const headerCells = cols.map(c=>`<th>${c.name}</th>`).join('');
  const bodyRows = targets.map(t=>{
    const cells = cols.map(col=>{
      const r = resolveLine(STATE.rules, t.kind, t.code, PRICING_TAB, col.code, PRICING_ASAT);
      if(!r.ok) return `<td><span class="pcell missing">Not set</span></td>`;
      const future = hasFutureChange(t.kind,t.code,PRICING_TAB,col.code);
      const priceStr = col.code && opByCode(col.code).model==='net_rate' ? (r.net!=null?formatRs(r.net):formatRs(r.retail)+' *') : formatRs(r.retail);
      return `<td><span class="pcell ${future?'future':''}" onclick="openPriceEdit('${t.kind}','${t.code}','${col.code||''}')">${priceStr}</span></td>`;
    }).join('');
    return `<tr><td class="rowhead" onclick="showHistory('${t.kind}','${t.code}')" style="cursor:pointer;">${t.name}</td>${cells}</tr>`;
  }).join('');

  return `
  <div class="page-head">
    <div><div class="eyebrow">Admin</div><h1 class="display-lg">Pricing</h1><p class="body-sm muted" style="margin-top:4px;">Prices are never overwritten — every change closes the old rule and opens a new one from an effective date.</p></div>
    <div style="display:flex; gap:12px; align-items:center;">
      <label class="body-sm">As at <input type="date" class="input" style="width:160px; display:inline-block;" value="${PRICING_ASAT}" onchange="PRICING_ASAT=this.value; renderApp();"/></label>
    </div>
  </div>
  <div class="tabs" style="margin-bottom:var(--space-4);">
    ${['adult','child','infant'].map(p=>`<button class="tab ${PRICING_TAB===p?'active':''}" onclick="PRICING_TAB='${p}'; renderApp();">${p[0].toUpperCase()+p.slice(1)}</button>`).join('')}
  </div>
  <div class="table-wrap" style="margin-bottom:var(--space-6);">
    <table class="pmatrix"><thead><tr><th style="text-align:left;">Item</th>${headerCells}</tr></thead><tbody>${bodyRows}</tbody></table>
  </div>
  <div class="caption">* Commission operators are shown at retail — the guest pays retail and the operator earns a commission automatically. → marks a price already scheduled for a future date. Click a row name for its price history; click a cell to schedule a change.</div>
  <div id="history-panel" style="margin-top:var(--space-5);"></div>`;
}
function hasFutureChange(kind, code, participant, opCode){
  const audience = opCode ? 'operator' : 'walk_in';
  return STATE.rules.some(r=>r.targetType===kind && r.targetId===code && r.participant===participant && r.audience===audience && (opCode?r.operatorId===opCode:true) && r.from > TODAY);
}
function showHistory(kind, code){
  const name = kind==='activity'?actByCode(code).name:pkgByCode(code).name;
  const rows = STATE.rules.filter(r=>r.targetType===kind && r.targetId===code && r.participant===PRICING_TAB && r.audience==='walk_in').sort((a,b)=>a.from.localeCompare(b.from));
  const html = rows.map(r=>`<div class="part-row"><span class="body-sm">${formatDateShort(r.from)} → ${r.to?formatDateShort(r.to):'current'}</span><span class="num" style="font-weight:700;">${formatRs(r.retail)}</span></div>`).join('') || `<div class="empty-state">No walk-in history recorded.</div>`;
  document.getElementById('history-panel').innerHTML = `<div class="card card-pad"><div class="label" style="color:var(--ink-muted); margin-bottom:8px;">${name} — ${PRICING_TAB} price history (walk-in)</div>${html}</div>`;
}
function openPriceEdit(kind, code, opCode){
  opCode = opCode || null;
  const r = resolveLine(STATE.rules, kind, code, PRICING_TAB, opCode, PRICING_ASAT);
  const name = kind==='activity'?actByCode(code).name:pkgByCode(code).name;
  const colName = opCode ? opByCode(opCode).name : 'Walk-in';
  const tomorrow = addDays(TODAY,1);
  showModal(`<h3 class="heading-sm">${name} — ${PRICING_TAB} — ${colName}</h3>
    <p class="body-sm muted" style="margin-bottom:var(--space-4);">Current: ${r.ok?formatRs(r.net!=null&&opCode?r.net:r.retail):'not set'}</p>
    <label class="field"><span class="label">New price (Rs)</span><input id="price-new" type="number" class="input" placeholder="e.g. 1900"/></label>
    <label class="field" style="margin-top:var(--space-3);"><span class="label">Effective from</span><input id="price-from" type="date" class="input" value="${tomorrow}" min="${tomorrow}"/></label>
    <div id="price-preview" class="caption" style="margin-top:var(--space-3);"></div>
    <div style="display:flex; gap:8px; margin-top:var(--space-4); justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmPriceEdit('${kind}','${code}','${opCode||''}')">Save price</button>
    </div>`);
  document.getElementById('price-new').oninput = updatePricePreview;
  document.getElementById('price-from').onchange = updatePricePreview;
  function updatePricePreview(){
    const val = document.getElementById('price-new').value;
    const from = document.getElementById('price-from').value;
    document.getElementById('price-preview').textContent = val ? `${name}, ${PRICING_TAB}, ${colName}: current price holds until ${formatDateShort(from)}, then Rs ${Number(val).toLocaleString()} from ${formatDateShort(from)}.` : '';
  }
}
function addDays(iso, n){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function confirmPriceEdit(kind, code, opCode){
  opCode = opCode || null;
  const val = Number(document.getElementById('price-new').value);
  const from = document.getElementById('price-from').value;
  if(!val || val<=0){ toast('Enter a price above zero.','danger'); return; }
  if(from <= TODAY){ toast('Effective date must be in the future.','danger'); return; }
  const audience = opCode ? 'operator' : 'walk_in';
  // close current open rule
  const open = STATE.rules.find(r=>r.targetType===kind && r.targetId===code && r.participant===PRICING_TAB && r.audience===audience && (opCode?r.operatorId===opCode:true) && !r.to);
  if(open) open.to = from;
  const isNetRow = opCode && opByCode(opCode).model==='net_rate';
  STATE.rules.push({ id:'PR'+Date.now(), targetType:kind, targetId:code, participant:PRICING_TAB, audience, operatorId:opCode, retail: isNetRow?null:Math.round(val*100), net: isNetRow?Math.round(val*100):null, from, to:null });
  saveState(); closeModal(); toast('New price scheduled.','success'); renderApp();
}

/* ================= modal ================= */
function showModal(innerHtml){
  document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">${innerHtml}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ================= boot ================= */
STATE = loadState();
ROUTE = parseHash();
renderApp();
</script>
